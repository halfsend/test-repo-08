# fullsend per-repo configuration
# https://github.com/fullsend-ai/fullsend
#
# This file configures fullsend for per-repo installation mode.
# See https://fullsend.sh/docs/guides/infrastructure/layered-config-reference
version: "1"
tracker:
    github:
        allowed_targets:
            repos:
                - fullsend-ai/fullsend
                - fullsend-ai/agents
runtime: dummy
roles:
    - triage
    - coder
    - review
    - fix
    - retro
    - prioritize
agents:
    - name: needs-review-bot
      source: harness/needs-review-bot.yaml
    - name: needs-coder-bot
      source: harness/needs-coder-bot.yaml
    - name: needs-triage-bot
      source: harness/needs-triage-bot.yaml
allowed_remote_resources:
    - https://raw.githubusercontent.com/fullsend-ai/fullsend/
    - https://raw.githubusercontent.com/fullsend-ai/agents/
mint_url: https://stage-mint.fullsend.sh
inference:
    project: it-gcp-konflux-e2e-fullsend
    wif_provider: projects/208332380190/locations/global/workloadIdentityPools/fullsend-inference/providers/gh-halfsend-test-repo-08
